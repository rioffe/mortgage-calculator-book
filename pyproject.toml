[project]
name = "mortgage-calculator-book"
version = "0.1.0"
description = "Fixed periodic payment calculator for a fixed-rate mortgage"
readme = "README.md"
authors = [
    { name = "Robert Ioffe", email = "robert.ioffe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "pyqt5>=5.15.11",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
mortgage-calculator-book = "mortgage_calculator_book.cli:main"
mortgage-calculator-gui = "mortgage_calculator_book.ui:main"
mortgage-ask = "mortgage_calculator_book.llm_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
